<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoxamonGO - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-container">
    <div class="login-header">
        <h1>MoxamonGO</h1>
        <p>Connexion requise</p>
    </div>

    <form id="login-form" class="login-form">
        <div class="form-group">
            <label for="username">Utilisateur</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div id="login-error" class="error-message hidden"></div>
        <button type="submit" class="btn primary full-width">Se connecter</button>
    </form>

    <form id="change-password-form" class="login-form hidden">
        <p class="warning-text">Vous devez changer votre mot de passe par défaut.</p>
        <div class="form-group">
            <label for="new-password">Nouveau mot de passe</label>
            <input type="password" id="new-password" name="new-password" minlength="8" required>
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="confirm-password" name="confirm-password" minlength="8" required>
        </div>
        <div id="change-error" class="error-message hidden"></div>
        <button type="submit" class="btn primary full-width">Changer le mot de passe</button>
    </form>
</div>

<script>
    const loginForm = document.getElementById('login-form');
    const changeForm = document.getElementById('change-password-form');
    const loginError = document.getElementById('login-error');
    const changeError = document.getElementById('change-error');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.classList.add('hidden');

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (data.success) {
                if (data.mustChange) {
                    loginForm.classList.add('hidden');
                    changeForm.classList.remove('hidden');
                } else {
                    window.location.href = '/';
                }
            } else {
                loginError.textContent = data.message || 'Identifiants invalides';
                loginError.classList.remove('hidden');
            }
        } catch (err) {
            loginError.textContent = 'Erreur de connexion au serveur';
            loginError.classList.remove('hidden');
        }
    });

    changeForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        changeError.classList.add('hidden');

        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword.length < 8) {
            changeError.textContent = 'Le mot de passe doit contenir au moins 8 caractères';
            changeError.classList.remove('hidden');
            return;
        }

        if (newPassword !== confirmPassword) {
            changeError.textContent = 'Les mots de passe ne correspondent pas';
            changeError.classList.remove('hidden');
            return;
        }

        try {
            const res = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword })
            });

            const data = await res.json();

            if (data.success) {
                window.location.href = '/';
            } else {
                changeError.textContent = data.message || 'Erreur lors du changement';
                changeError.classList.remove('hidden');
            }
        } catch (err) {
            changeError.textContent = 'Erreur de connexion au serveur';
            changeError.classList.remove('hidden');
        }
    });
</script>
</body>
</html>
